name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds the library and the binary, and runs the `#guard` tests in
      # Tests/Basic.lean, since Tests is a default target.
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      - name: End-to-end test of the binary
        run: ./scripts/selftest.sh
      - name: The theorems have no holes
        run: ./scripts/check-axioms.sh
